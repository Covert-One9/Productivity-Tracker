
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Tracker</title>
  <link rel="stylesheet" href="look.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="Brain.js" defer></script>
</head>
<body>
  
<section id="authSection">
  <h2>Productivity Tracker Login</h2>

  <form id="authForm">
    <label for="authEmail">Email</label>
    <input
      id="authEmail"
      type="email"
      placeholder="Enter your email"
      required
    />

    <label for="authPassword">Password</label>
    <input
      id="authPassword"
      type="password"
      placeholder="Create a password"
      required
      minlength="8"
    />

    <button type="button" id="signUpBtn">Create Account</button>
    <button type="submit" id="signInBtn">Log In</button>
  </form>

  <p id="authMessage" role="status"></p>
  <button type="button" id="signOutBtn" hidden>Log Out</button>
</section>


  <div class="container">
    <h1>Homework</h1>
    <p class="subtitle">Homework to do</p>

    <form class="task-form" id="taskForm">
      <input
        id="taskInput"
        type="text"
        placeholder="What do you need to do?"
        required
        maxlength="200"
      >

      <label for="taskPriority">Priority</label>
      <select id="taskPriority">
        <option value="Low">Low Priority</option>
        <option value="Medium" selected>Medium Priority</option>
        <option value="High">High Priority</option>
      </select>

      <label for="dueDate">Due Date</label>
      <input id="dueDate" type="date">

      <button type="submit">Add Task</button>
    </form>

    <div class="stats">
      <strong id="taskCount">0 of 0 tasks completed</strong>
      <div id="progressText">0% complete</div>

      <div class="progress-bar">
        <div id="progress"></div>
      </div>
    </div>

    <ul id="taskList"></ul>
  </div>

  <div class="dashboard">
    <div class="box">
      <h2>Today's Progress</h2>
      <p id="todayProgress">0 tasks completed today</p>
    </div>

    <div class="box">
      <h2>Daily Goals</h2>
      <p>Complete your daily goals here.</p>
    </div>

    <div class="box">
      <h2>My Tasks</h2>
      <p id="totalTasks">You have 0 tasks.</p>
    </div>

    <div class="box">
      <h2>Focus Timer</h2>
      <p>Time to concentrate!</p>
      <button id="focusButton" type="button">Start 25-Minute Focus</button>
      <p id="timerDisplay">25:00</p>
    </div>
  </div>

  <div class="celebration">
    <button id="confettiButton" type="button">
      🎉 Click for confetti
    </button>
  </div>

</body>
</html>
