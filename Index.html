
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productivity Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #00000010;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 25px;
    }

    .task-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 15px;
      cursor: pointer;
      background: #4f46e5;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }

    .stats {
      background: #eef2ff;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .progress-bar {
      height: 10px;
      background: #d1d5db;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 10px;
    }

    #progress {
      width: 0%;
      height: 100%;
      background: #4f46e5;
      transition: width 0.3s;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    li span {
      flex: 1;
      overflow-wrap: anywhere;
    }

    li.done span {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .delete {
      background: #ef4444;
    }

    .empty {
      color: #9ca3af;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

</body>
<body>
  <div class="container">
    <h1>My Productivity Tracker</h1>
    <p class="subtitle">Small steps. Consistent progress.</p>

    <form class="task-form" id="taskForm">
      <input
        id="taskInput"
        type="text"
        placeholder="What do you need to do?"
        required
      >

       <select id="priorityInput">
          <option value="Low">Low Priority</option>
          <option value="Medium" selected>Medium Priority</option>
          <option value="High">High Priority</option>
        </select>

      <button type="submit">Add Task</button>

     
    </form>

    <div class="stats">
      <strong id="taskCount">0 tasks completed</strong>
      <div id="progressText">0% complete</div>
      <div class="progress-bar">
        <div id="progress"></div>
      </div>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    const form = document.getElementById("taskForm");
    const input = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const taskCount = document.getElementById("taskCount");
    const progress = document.getElementById("progress");
    const progressText = document.getElementById("progressText");

    // Load saved tasks from the browser
    let tasks = JSON.parse(
      localStorage.getItem("productivityTasks") || "[]"
    );

    function saveTasks() {
      localStorage.setItem(
        "productivityTasks",
        JSON.stringify(tasks)
      );
    }

    function renderTasks() {
      taskList.replaceChildren();

      const completed = tasks.filter(task => task.done).length;
      const percentage = tasks.length
        ? Math.round((completed / tasks.length) * 100)
        : 0;

      taskCount.textContent =
        `${completed} of ${tasks.length} tasks completed`;

      progressText.textContent = `${percentage}% complete`;
      progress.style.width = `${percentage}%`;

      if (tasks.length === 0) {
        const message = document.createElement("li");
        message.className = "empty";
        message.textContent = "No tasks yet. Add your first task!";
        taskList.appendChild(message);
        return;
      }

      tasks.forEach(task => {
        const item = document.createElement("li");

        if (task.done) item.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.setAttribute(
          "aria-label",
          `Complete ${task.text}`
        );

        checkbox.addEventListener("change", () => {
          task.done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete";
        deleteButton.className = "delete";

        deleteButton.addEventListener("click", () => {
          tasks = tasks.filter(t => t.id !== task.id);
          saveTasks();
          renderTasks();
        });

        item.append(checkbox, text, deleteButton);
        taskList.appendChild(item);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      tasks.push({
        id: crypto.randomUUID(),
        text,
        done: false
      });

      saveTasks();
      renderTasks();
      input.value = "";
      input.focus();
    });

    renderTasks();
  </script>
</body>
</html>
